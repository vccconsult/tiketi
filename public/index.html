<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сервизни тикети</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/style.css?v=3">
<link rel="stylesheet" href="/assets/app.css?v=3">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Сервизни тикети</h1>
      <div class="sub" id="sub">Зареждане на данните…</div>
    </div>
    <div class="actions">
      <button type="button" class="meBox" id="meBox" title="Моят профил"></button>
      <button id="btnHist" type="button">История</button>
      <button id="btnUsers" type="button">Екип</button>
      <a id="btnExport" class="btnlink" href="/api/export">Експорт за Excel</a>
      <button id="btnNew" type="button" class="primary">+ Нов тикет</button>
    </div>
  </header>

  <nav class="views" id="views" aria-label="Изгледи">
    <button type="button" data-view="mine">Моите тикети <span class="vc" id="vcMine"></span></button>
    <button type="button" data-view="all">Общи тикети <span class="vc" id="vcAll"></span></button>
    <button type="button" data-view="companies">Компании <span class="vc" id="vcComp"></span></button>
  </nav>

  <div id="warn" class="warn" hidden></div>

  <!-- TICKETS VIEW -->
  <section id="ticketsView" class="stack">
    <div class="subbar">
      <div class="seg" id="segMine" role="group" aria-label="Кои мои тикети">
        <button type="button" data-mine="both" class="on">Всички мои</button>
        <button type="button" data-mine="assigned">Възложени на мен</button>
        <button type="button" data-mine="reported">Подадени от мен</button>
      </div>
      <div class="seg" id="segOpen" role="group" aria-label="Отворени или затворени">
        <button type="button" data-open="open" class="on">Отворени</button>
        <button type="button" data-open="closed">Затворени</button>
        <button type="button" data-open="any">Всички</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>
    <div class="team" id="team"></div>

    <div class="bar">
      <input id="q" type="search" placeholder="Търси по №, заглавие, описание, компания или обект…" aria-label="Търсене">
      <select id="fComp" aria-label="Компания"></select>
      <select id="fPrio" aria-label="Приоритет"></select>
      <select id="fCat" aria-label="Категория"></select>
      <select id="fSort" aria-label="Подреждане">
        <option value="new">Най-нови първо</option>
        <option value="old">Най-стари първо</option>
        <option value="prio">По приоритет</option>
        <option value="upd">Последно обновени</option>
      </select>
    </div>

    <div class="tablebox">
      <table>
        <thead><tr><th>№</th><th>Проблем</th><th>Статус</th><th>Приоритет</th><th>Отговорник</th><th>Подал</th><th>Създаден</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" hidden></div>
    </div>
  </section>

  <!-- COMPANIES VIEW -->
  <section id="companiesView" class="stack" hidden>
    <div class="bar">
      <input id="cq" type="search" placeholder="Търси компания по име, ЕИК, град, лице за контакт или телефон…" aria-label="Търсене на компания">
      <button type="button" class="primary" id="btnNewComp">+ Нова компания</button>
    </div>
    <div class="tablebox">
      <table>
        <thead><tr><th>Компания</th><th>Лице за контакт</th><th>Телефон</th><th>ЕИК</th><th class="num">Отворени</th><th class="num">Всички</th></tr></thead>
        <tbody id="crows"></tbody>
      </table>
      <div id="cempty" class="empty" hidden></div>
    </div>
  </section>

  <div class="note">Данните се обновяват автоматично на всеки 15 секунди.</div>
</div>

<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog"></aside>
<div id="toast" class="toast" hidden></div>
<script src="/assets/app.js?v=3"></script>
</body>
</html>
